name: CI

# Quality gate on every push and pull request. Mirrors the root package.json
# scripts (`pnpm -r lint|typecheck|test`) so "green locally" == "green in CI".
# Release packaging lives separately in release.yml and is never run here.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version is read from the root package.json `packageManager` field
      # (pnpm@9.12.0) — don't pass `version:` or action-setup@v4 errors.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each step runs across every workspace package. Ordered cheapest-first
      # so the fastest signal (lint) fails the run before the slower gates.
      - name: Check version policy
        run: pnpm check:versions

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies (OSV)
        run: pnpm audit:prod

      # Production build catches Next/RSC issues that tsc alone misses. The
      # static Electron export + .dmg packaging still live in release.yml.
      - name: Build (web production)
        run: pnpm --filter @movie-desk/web build
        env:
          # `next dev --turbopack` runs immediately afterward for Playwright.
          # Production and development caches are incompatible, so keep the
          # build output away from the dev server's standard `.next` tree.
          NEXT_DIST_DIR: .next-ci

      - name: Install Playwright Chromium
        run: pnpm --filter @movie-desk/web exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e
