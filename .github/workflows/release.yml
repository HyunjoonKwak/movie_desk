name: Release

# Manual-only. Two ways to trigger:
#   1. Push a version tag:   git tag v0.1.1 && git push --tags
#   2. GitHub UI:            Actions → Release → "Run workflow"
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-mac:
    runs-on: macos-latest
    permissions:
      # electron-builder publishes to GitHub Releases, which needs write
      # access to the repo's contents.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is read from the root package.json `packageManager` field
      # (pnpm@9.12.0). Don't pass `version:` here — the action errors
      # if both are specified.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:web first downloads and verifies all bundled local AI models,
      # then the release packages the static export as signed-or-unsigned
      # arm64 + x64 DMGs. The GitHub Release matches the version in
      # apps/desktop/package.json.
      - name: Build and publish macOS .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @movie-desk/desktop release:mac
