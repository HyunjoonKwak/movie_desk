name: Release

# Manual-only. Two ways to trigger:
#   1. Push a version tag:   git tag v0.1.1 && git push --tags
#   2. GitHub UI:            Actions → Release → "Run workflow"
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-mac:
    runs-on: macos-latest
    permissions:
      # electron-builder publishes to GitHub Releases, which needs write
      # access to the repo's contents.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version is read from the root package.json `packageManager` field
      # (pnpm@9.12.0). Don't pass `version:` here — action-setup@v4 errors
      # if both are specified.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads the Whisper subtitling model (~40 MB) into
      # apps/web/public/whisper/ so the bundled .app can transcribe
      # fully offline from first launch.
      - name: Prebundle Whisper model
        run: pnpm --filter @cut/web prebundle:whisper

      # Builds the static web export and packages it as a signed-or-unsigned
      # .dmg for arm64 + x64, then uploads both to a GitHub Release matching
      # the version in apps/desktop/package.json.
      - name: Build and publish macOS .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @cut/desktop release:mac
