<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191e24"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#605dff"/>
      <stop offset="100%" stop-color="#7774ff"/>
    </linearGradient>
  </defs>
  <rect width="540" height="380" fill="url(#bg)"/>
  <!-- Subtle waveform decoration along the bottom -->
  <g opacity="0.10" fill="url(#accent)">
    <rect x="40"  y="320" width="3" height="20"/>
    <rect x="50"  y="310" width="3" height="30"/>
    <rect x="60"  y="300" width="3" height="40"/>
    <rect x="70"  y="290" width="3" height="50"/>
    <rect x="80"  y="295" width="3" height="45"/>
    <rect x="90"  y="305" width="3" height="35"/>
    <rect x="100" y="315" width="3" height="25"/>
    <rect x="110" y="300" width="3" height="40"/>
    <rect x="120" y="285" width="3" height="55"/>
    <rect x="130" y="295" width="3" height="45"/>
    <rect x="140" y="310" width="3" height="30"/>
    <rect x="430" y="315" width="3" height="25"/>
    <rect x="440" y="305" width="3" height="35"/>
    <rect x="450" y="295" width="3" height="45"/>
    <rect x="460" y="285" width="3" height="55"/>
    <rect x="470" y="295" width="3" height="45"/>
    <rect x="480" y="305" width="3" height="35"/>
    <rect x="490" y="315" width="3" height="25"/>
  </g>
  <!-- Header -->
  <text x="270" y="60" text-anchor="middle"
        font-family="Pretendard, -apple-system, system-ui, sans-serif" font-size="22" font-weight="600"
        fill="#e6e8eb">Movie Desk</text>
  <text x="270" y="84" text-anchor="middle"
        font-family="Pretendard, -apple-system, system-ui, sans-serif" font-size="12"
        fill="#7c828a">Local-first, AI-native video editor</text>
  <!-- Arrow suggestion (icon → Applications) -->
  <g stroke="#605dff" stroke-width="2" fill="none" opacity="0.6">
    <line x1="195" y1="220" x2="345" y2="220" stroke-linecap="round"/>
    <polyline points="335,210 345,220 335,230" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="270" y="260" text-anchor="middle"
        font-family="Pretendard, -apple-system, system-ui, sans-serif" font-size="11"
        fill="#7c828a">Drag to Applications to install</text>
</svg>
