# Kept for upgrade continuity with existing installations.
appId: dev.cuteditor.app
productName: Movie Desk
copyright: Copyright © 2026 Movie Desk contributors

directories:
  output: dist
  buildResources: build

# Include the Electron shell sources + the static-exported web app produced
# by `pnpm run build:web` at apps/web/out.
files:
  - "src/**/*"
  - "package.json"
extraResources:
  - from: "../web/out"
    to: "web"
    filter: ["**/*"]

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: "build/icon.icns"
  hardenedRuntime: true
  gatekeeperAssess: false
  # `identity: null` produces an unsigned `.app` — useful for local testing
  # without an Apple Developer ID. To sign + notarise, unset this line and
  # export the standard env vars:
  #   export CSC_LINK=... CSC_KEY_PASSWORD=...
  #   export APPLE_ID=... APPLE_APP_SPECIFIC_PASSWORD=... APPLE_TEAM_ID=...
  # electron-builder picks them up automatically when CSC_* is set.
  identity: null

dmg:
  background: "build/dmg-background.png"
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 220
    - x: 390
      y: 220
      type: link
      path: /Applications

# Release upload target. electron-builder writes the .dmg files (plus
# `latest-mac.yml`) to the GitHub Release matching the version in
# apps/desktop/package.json. The in-app update check (src/updater.cjs) reads
# the same repo's releases/latest API and offers the .dmg download — unsigned
# builds cannot self-install, so installation stays a manual download. Set
# `GH_TOKEN` to a personal access token with `repo` scope before running
# `pnpm --filter @movie-desk/desktop exec electron-builder --mac --publish=always`.
publish:
  - provider: github
    owner: HyunjoonKwak
    repo: movie_desk
